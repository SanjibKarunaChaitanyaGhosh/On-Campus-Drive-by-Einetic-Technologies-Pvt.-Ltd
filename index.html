<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Set 2 - Section A - String Pattern Analyzer</title>
<style>
  body {
    color: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
  }
  h1 {
    margin-bottom: 5px;
  }
  .input-box {
    background: #2b2b40;
    padding:20px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.4);
    margin-bottom: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  input[type="text"] {
    padding: 8px 12px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    outline: none;
    width: 220px;
    margin-right: 10px;
  }
  button {
    padding: 9px 20px;
    font-size: 15px;
    border: none;
    border-radius: 6px;
    background: #06d6a0;
    color: #10121a;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .output-box {
    padding: 20px 30px;
    border-radius: 10px;
    width: 90%;
    max-width: 600px;
    box-shadow: 0 0 15px rgba(0,0,0,0.4);
  }
  .step {
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #444;
  }
  .step:last-child { border-bottom: none; }
  .step-title {
    font-weight: bold;
    margin-bottom: 6px;
  }
  pre {
    padding: 10px;
    border-radius: 6px;
    font-size: 15px;
    line-height: 1.3;
    overflow-x: auto;
  }
  .dominant {
    font-size: 18px;
    font-weight: bold;
  }

</style>
</head>
<body>

<h1>String Pattern Analyzer</h1>
<p>Set 2 | Section A - Practical Coding</p>

<div class="input-box">
  <input type="text" id="strInput" placeholder="Enter a string (3-10 letters)">
  <button onclick="processInput()">Run</button>
  <div id="error"></div>
</div>

<div class="output-box" id="output" style="display:none;"></div>

<script>
function processInput() {
  const errorDiv = document.getElementById('error');
  const outputBox = document.getElementById('output');
  errorDiv.textContent = '';
  outputBox.innerHTML = '';
  outputBox.style.display = 'none';

  const raw = document.getElementById('strInput').value;

  // Validation: only alphabet characters, length 3-10
  const alphaOnly = /^[A-Za-z]+$/;
  if (!alphaOnly.test(raw)) {
    errorDiv.textContent = 'Error: Only alphabet characters are allowed.';
    return;
  }
  if (raw.length < 3 || raw.length > 10) {
    errorDiv.textContent = 'Error: Length must be between 3 and 10 characters.';
    return;
  }

  // STEP 1: Take string input
  const step1_input = raw;

  // STEP 2: Convert previous step's result to uppercase
  const step2_upper = step1_input.toUpperCase();

  // STEP 3: Count vowels and consonants from step 2 result
  let vowelCount = 0;
  let consonantCount = 0;
  const vowels = "AEIOU";
  for (let ch of step2_upper) {
    if (vowels.includes(ch)) vowelCount++;
    else consonantCount++;
  }

  // STEP 4: Generate Pattern 1 - Reverse Alphabet Ladder
  // height = length of string (from step 1)
  const height = step1_input.length;
  let pattern1 = '';
  for (let row = 1; row <= height; row++) {
    let line = '';
    for (let col = 0; col < row; col++) {
      // 90 = 'Z' char code; step outward from Z
      line += String.fromCharCode(90 - col) + ' ';
    }
    pattern1 += line.trim() + '\n';
  }

  // STEP 5: Generate Pattern 2 - Hollow Square
  // size = vowel count (from step 3) + 3
  const size = vowelCount + 3;
  let pattern2 = '';
  for (let r = 1; r <= size; r++) {
    let line = '';
    for (let c = 1; c <= size; c++) {
      if (r === 1 || r === size || c === 1 || c === size) {
        line += '* ';
      } else {
        line += '  ';
      }
    }
    pattern2 += line.trimEnd() + '\n';
  }

  // STEP 6: Compare vowel count vs consonant count (from step 3)
  let dominance = '';
  let dominanceClass = '';
  if (vowelCount > consonantCount) {
    dominance = 'VOWEL DOMINANT';
    dominanceClass = 'vowel';
  } else {
    dominance = 'CONSONANT DOMINANT';
    dominanceClass = 'consonant';
  }

  // Build output
  outputBox.style.display = 'block';
  outputBox.innerHTML = `
    <div class="step">
      <div class="step-title">Step 1: Original Input</div>
      <pre>${step1_input}</pre>
    </div>
    <div class="step">
      <div class="step-title">Step 2: Uppercase Conversion</div>
      <pre>${step2_upper}</pre>
    </div>
    <div class="step">
      <div class="step-title">Step 3: Vowel / Consonant Count</div>
      <pre>Vowels: ${vowelCount}
Consonants: ${consonantCount}</pre>
    </div>
    <div class="step">
      <div class="step-title">Step 4: Pattern 1 - Reverse Alphabet Ladder (height = ${height})</div>
      <pre>${pattern1}</pre>
    </div>
    <div class="step">
      <div class="step-title">Step 5: Pattern 2 - Hollow Square (size = ${size})</div>
      <pre>${pattern2}</pre>
    </div>
    <div class="step">
      <div class="step-title">Step 6: Final Result</div>
      <div class=" ${dominanceClass}">${dominance}</div>
    </div>
  `;
}
</script>

</body>
</html>
